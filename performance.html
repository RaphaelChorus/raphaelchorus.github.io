<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>갤러리 - 라파엘코러스</title>
    <meta name="description" content="라파엘코러스 - 시각장애인으로 구성된 천상의 화음, 희망을 노래하는 합창단입니다.">
    <meta name="keywords" content="라파엘코러스, 라파엘, 장애인, 장애인합창단, 시각장애인 합창단, 합창단, Raphael Chorus, Raphael, Disabled, Choir for the Disabled, Blind Choir, Choir, Performance">
    <meta name="author" content="라파엘코러스">

<meta property="og:type" content="website">
<meta property="og:title" content="라파엘코러스 - 희망의 화음">
<meta property="og:description" content="시각장애를 넘어 아름다운 노래를 선사하는 라파엘코러스입니다.">
<meta property="og:image" content="https://raphaelchorus.github.io/H2_00635.jpg"> 
<meta property="og:url" content="https://raphaelchorus.github.io">
    <style>
    /* 1. 기본 설정 및 화면 떨림 방지 */
    html, body { 
        margin: 0; padding: 0; width: 100%; overflow-x: hidden;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
        line-height: 1.8; color: #333; background-color: #fffbe6; 
    }

    /* 2. [업데이트] 통합 헤더 디자인 - 전 페이지 통일 */
    header { 
        position: fixed; /* 상단 고정 */
        top: 0; left: 0; width: 100%; 
        display: flex; justify-content: space-between; align-items: center; 
        padding: 0 5%; 
        height: 80px; /* 헤더 높이 통일 */
        z-index: 1000; box-sizing: border-box;
        background: rgba(18, 18, 18, 0.95); /* 반투명 블랙 */
        box-shadow: 0 2px 15px rgba(0,0,0,0.3);
    }

    .logo-container { display: flex; align-items: center; }

    /* [핵심] 금빛 로고 필터 적용 */
    .logo-img { 
        height: 50px; 
        width: auto; 
        display: block;
        /* 검은 로고를 금색으로 변환 */
        filter: invert(85%) sepia(20%) saturate(800%) hue-rotate(350%) brightness(105%) contrast(105%);
        transition: transform 0.3s ease;
    }
    .logo-img:hover { transform: scale(1.05); }

    /* 3. 네비게이션 스타일 */
    nav { display: flex; gap: 25px; }

    nav a { 
        color: #fff; text-decoration: none; 
        font-weight: bold; font-size: 1.05rem;
        transition: color 0.3s ease;
    }
    nav a:hover { color: #ffcc00; }
    nav a[aria-current="page"] { color: #ffcc00; border-bottom: 2px solid #ffcc00; }

    /* 4. 상단 배너 (헤더 높이만큼 여백 추가) */
    .sub-header { 
        margin-top: 80px;
        background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('H2_00635.jpg');
        background-size: cover; background-position: center;
        padding: 100px 10%; text-align: center; color: white; 
        border-bottom: 5px solid #ffcc00; 
    }
    .sub-header h2 { font-size: 2.8rem; margin: 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }

    /* 5. 갤러리 레이아웃 */
    .container { max-width: 1200px; margin: 60px auto; padding: 0 20px; }
    
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); /* 사진 너비 최적화 */
        gap: 30px;
    }

    .gallery-item {
        background: #fff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        border: 1px solid #eee;
        display: flex;
        flex-direction: column;
        transition: all 0.4s ease;
    }
    .gallery-item:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-color: #ffcc00; }

    .gallery-item img {
        width: 100%;
        height: 240px; /* 사진 높이 밸런스 조정 */
        object-fit: cover; 
        display: block;
        transition: transform 0.5s ease;
    }
    .gallery-item:hover img { transform: scale(1.05); }

    .gallery-desc {
        padding: 20px;
        text-align: center;
        font-weight: bold;
        font-size: 1rem;
        color: #222;
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        word-break: keep-all;
    }

    footer { background: #1a1a1a; color: #888; padding: 50px; text-align: center; margin-top: 100px; }

    /* 6. [모바일 업데이트] 예술적 비율 대응 */
    @media (max-width: 768px) {
        header { 
            flex-direction: column; height: auto; padding: 15px 10px;
            background: rgba(18, 18, 18, 0.98);
        }
        .logo-img { height: 40px; }
        nav { margin-top: 15px; gap: 15px; width: 100%; justify-content: center; }
        nav a { font-size: 0.9rem; }
        
        .sub-header { margin-top: 110px; padding: 60px 5%; }
        .sub-header h2 { font-size: 1.8rem; }
        
        .gallery-grid { grid-template-columns: 1fr; gap: 25px; } /* 모바일 1열 배치 */
        .gallery-item img { height: 210px; }
    }
</style>
</head>
<body>
    <header role="banner">
    <div class="logo-container">
        <a href="index.html">
            <img src="RaphaelsvgLogo.png" alt="라파엘코러스" class="logo-img">
        </a>
    </div>
    <nav role="navigation" aria-label="메인 메뉴">
        <a href="index.html">Raphael</a>
        <a href="about.html">About</a>
        <a href="story.html">Story</a>
        <a href="performance.html" aria-current="page">Gallery</a>
        <a href="support.html">Support</a>
    </nav>
</header>
    <section class="sub-header">
        <h2>갤러리</h2>
    </section>

    <main class="container">
        <div class="gallery-grid" id="gallery-container"></div>
    </main>

    <footer>
        <p>&copy; 2026 라파엘코러스. All rights reserved.</p>
    </footer>

    <script>
        const photos = [
            { id: 1, desc: "힐링콘서트를 시작하며 멋지게 정렬을 마쳤습니다." },
            { id: 2, desc: "이제 천사의 사랑을 담은 노래소리가 뿜어집니다." },
            { id: 3, desc: "금호중앙교회의 스크린이 돋보이는 라파엘 전체의 모습" },
            { id: 4, desc: "마치 마법의 손짓을 하고 계신 듯, 이돈응 감독님이 라바엘의 노래를 집중 이끄시네요" },
            { id: 5, desc: "금호중앙교회의 고마운 분들과 함께한 사진" },
            { id: 6, desc: "흰연주복의 소프라노 알토 빨간 보타이의 테너 베이스" },
            { id: 7, desc: "여성분들의 혼신을 다해 노래하는 소리가 들리네요" },
            { id: 8, desc: "라파엘의 표정이 모든 기쁨을 보여줍니다." },
            { id: 9, desc: "아름다운 모습이 노래로 들리네요" },
            { id: 10, desc: "여자대원들의 연주복이 은빛으로 빛나며 기뻐해요" }
        ];

        const container = document.getElementById('gallery-container');

        for (let i = 1; i <= 40; i++) {
            const photoInfo = photos.find(p => p.id === i) || { id: i, desc: `라파엘코러스 힐링콘서트 공연 사진 ${i}번` };
            
            container.innerHTML += `
                <article class="gallery-item">
                    <img src="pf${photoInfo.id}.jpg" 
                         alt="${photoInfo.desc}" 
                         onerror="this.src='default-gallery.jpg';">
                    <div class="gallery-desc">${photoInfo.desc}</div>
                </article>
            `;
        }
    </script>
</body>
