<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>라파엘 소개 - 라파엘코러스</title>
    <style>
        /* [모바일 메뉴 깨짐 방지 및 레이아웃 최적화] */
header { 
    background: #000; 
    color: #fff; 
    padding: 1rem 5%; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    position: sticky; 
    top: 0; 
    z-index: 100;
}

header h1 { 
    margin: 0; 
    font-size: 1.5rem; 
    white-space: nowrap; /* 제목 줄바꿈 방지 */
}

nav { 
    display: flex; 
    gap: 15px; 
}

nav a { 
    color: #fff; 
    text-decoration: none; 
    font-weight: bold; 
    font-size: 0.95rem;
    white-space: nowrap; /* 메뉴 글자 줄바꿈 방지 */
}

nav a[aria-current="page"] { 
    color: #ffcc00; 
    border-bottom: 2px solid #ffcc00; 
}

/* 모바일 전용 (폭 768px 이하) */
@media (max-width: 768px) {
    header {
        flex-direction: column; /* 세로로 쌓기 */
        padding: 15px 10px;
    }

    header h1 {
        margin-bottom: 15px; /* 제목과 메뉴 사이 간격 */
        font-size: 1.4rem;
        text-align: center;
        width: 100%;
    }

    nav {
        width: 100%;
        justify-content: center; /* 메뉴 중앙 정렬 */
        flex-wrap: wrap; /* 폭이 아주 좁으면 자연스럽게 줄바꿈 */
        gap: 10px 15px; /* 가로 세로 간격 조절 */
    }

    nav a {
        font-size: 0.9rem; /* 글자 크기 살짝 줄임 */
        padding: 5px 2px;
    }
}
    </style>
</head>
