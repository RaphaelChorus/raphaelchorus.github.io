<section class="container" style="margin-top: 80px; text-align: center;">
    <h2 style="font-size: 2rem; margin-bottom: 40px;">최신 소식</h2>
    
    <div id="news-container" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">
        </div>
</section>

<script>
    /**
     * 1. 업데이트 방법: 아래 newsData 배열에 새로운 소식을 맨 위에 추가하면 됩니다.
     * - title: 제목
     * - date: 날짜
     * - link: 클릭 시 이동할 주소 (없으면 '#' 유지)
     */
    const newsData = [
        { title: "2026년 정기 연주회 연습 시작", date: "2026.02.01", link: "#" },
        { title: "새로운 단원 모집 안내 (테너, 베이스)", date: "2026.01.20", link: "#" },
        { title: "라파엘코러스 홈페이지 리뉴얼 오픈", date: "2026.01.15", link: "#" },
        { title: "지난 공연 다시보기: 희망의 화음", date: "2025.12.25", link: "#" },
        { title: "후원자 감사의 밤 행사 안내", date: "2025.12.10", link: "#" },
        // 여기에 추가해도 5개까지만 노출됩니다.
    ];

    /**
     * 2. 뉴스 렌더링 함수
     */
    function renderNews() {
        const container = document.getElementById('news-container');
        
        // 최신순으로 5개만 자르기
        const latestNews = newsData.slice(0, 5);

        // HTML 생성
        container.innerHTML = latestNews.map(news => `
            <div class="news-card" style="
                flex: 1; 
                min-width: 250px; 
                max-width: 300px; 
                background: #fff; 
                padding: 25px; 
                border-radius: 15px; 
                border: 1px solid #eee; 
                box-shadow: 0 4px 10px rgba(0,0,0,0.05);
                transition: transform 0.3s;
                text-align: left;
                cursor: pointer;"
                onclick="location.href='${news.link}'">
                <span style="color: #d32f2f; font-size: 0.85rem; font-weight: bold;">${news.date}</span>
                <h4 style="margin: 10px 0 0; font-size: 1.1rem; line-height: 1.4; color: #333;">${news.title}</h4>
            </div>
        `).join('');
    }

    // 페이지 로드 시 실행
    window.onload = renderNews;
</script>
