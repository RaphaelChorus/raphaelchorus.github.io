<script>
    /**
     * 배경음악 자동 재생 및 클릭 시 정지 로직
     */
    document.addEventListener('DOMContentLoaded', () => {
        const audio = document.getElementById('introMusic');
        let isPlaying = false;

        // 1. 5초 뒤 자동 재생 시도 함수
        const startMusicTimer = () => {
            setTimeout(() => {
                audio.play().then(() => {
                    isPlaying = true;
                    console.log("음악 재생 시작");
                }).catch(() => {
                    console.log("브라우저 정책으로 대기 중... 상호작용 시 재생됩니다.");
                });
            }, 5000);
        };

        // 2. 사용자가 화면을 건드리면(클릭, 터치 등) 재생 조건 충족 및 정지 기능 부여
        const handleInteraction = (e) => {
            // 아직 재생 전이라면 재생 예약
            if (!isPlaying && !audio.dataset.ready) {
                audio.dataset.ready = "true";
                startMusicTimer();
            } 
            // 이미 음악이 나오고 있다면 클릭 시 정지 (스크롤 등에는 반응하지 않음)
            else if (isPlaying && e.type === 'click') {
                audio.pause();
                isPlaying = false;
                console.log("사용자 클릭으로 음악 정지");
                // 정지 후에는 다시 클릭해도 재생되지 않도록 리스너 제거 가능
            }
        };

        // 모든 상호작용에 대해 재생 준비를 하되, '클릭'시에만 정지하도록 설정
        document.addEventListener('click', handleInteraction);
        document.addEventListener('touchstart', handleInteraction);
        
        // 페이지 로드 즉시 타이머 시작 (브라우저가 허용하는 경우 바로 실행)
        startMusicTimer();
    });
</script>
