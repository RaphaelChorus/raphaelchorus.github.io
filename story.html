<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스토리 - 라파엘코러스</title>
    <meta name="description" content="라파엘코러스 - 시각장애인으로 구성된 천상의 화음, 희망을 노래하는 합창단입니다.">
  <style>
    /* 1. 기본 설정 및 화면 떨림 방지 */
    html, body { 
        margin: 0; padding: 0; width: 100%; overflow-x: hidden;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
        line-height: 1.8; color: #333; background-color: #fffbe6; 
    }
    
    /* 2. [업데이트] 통합 헤더 디자인 - index와 100% 일치 */
    header { 
        position: fixed; /* 페이지 상단에 고정 */
        top: 0; left: 0; width: 100%; 
        display: flex; justify-content: space-between; align-items: center; 
        padding: 0 5%; 
        height: 80px; /* 헤더 높이 통일 */
        z-index: 1000; box-sizing: border-box;
        background: rgba(18, 18, 18, 0.95); /* 고급스러운 진회색 반투명 */
        box-shadow: 0 2px 15px rgba(0,0,0,0.3);
    }

    .logo-container { display: flex; align-items: center; }

    /* [핵심] 금빛 로고 필터 적용 */
    .logo-img { 
        height: 50px; 
        width: auto; 
        display: block;
        /* 검은 로고를 샴페인 골드로 변환 */
        filter: invert(85%) sepia(20%) saturate(800%) hue-rotate(350%) brightness(105%) contrast(105%);
        transition: transform 0.3s ease;
    }
    .logo-img:hover { transform: scale(1.05); }

    /* 3. 네비게이션 스타일 */
    nav { display: flex; gap: 25px; }

    nav a { 
        color: #fff; text-decoration: none; 
        font-weight: bold; font-size: 1.05rem;
        transition: color 0.3s ease;
    }
    nav a:hover { color: #ffcc00; }
    nav a[aria-current="page"] { color: #ffcc00; border-bottom: 2px solid #ffcc00; }
        
/* 4. 상단 배경 배너 (헤더 높이만큼 여백 추가) */
    .sub-header { 
        margin-top: 80px; /* 헤더가 fixed이므로 겹치지 않게 여백 추가 */
        background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('SeoulForest_20260525_18.jpg');
        background-size: cover; background-position: center;
        padding: 100px 10%; text-align: center; color: white; 
        border-bottom: 5px solid #ffcc00; 
    }
    .sub-header h2 { font-size: 2.8rem; margin: 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); letter-spacing: -1px; }

    
    /* 4. 컨테이너 및 페이지 헤더 */
    .container { max-width: 850px; margin: 60px auto; padding: 0 20px; }
    .page-header { text-align: center; margin-bottom: 60px; }
    .page-header h2 { font-size: 2.8rem; margin-bottom: 15px; color: #111; letter-spacing: -1px; }
    .page-header p { font-size: 1.2rem; color: #666; }

    /* 5. 블로그 리스트 스타일 */
    #blog-list { list-style: none; padding: 0; }
    .blog-item { 
        background: #fff; margin-bottom: 30px; border-radius: 20px; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden;
        border: 1px solid #ddd;
        transition: all 0.4s ease;
    }
    .blog-item:hover { 
        transform: translateY(-8px); 
        box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        border-color: #ffcc00; 
    }
    .blog-item a { text-decoration: none; color: inherit; display: block; padding: 35px; }
    .blog-item h3 { margin: 0 0 12px 0; font-size: 1.5rem; color: #222; line-height: 1.4; }
    .blog-item p { margin: 0; color: #666; font-size: 1.05rem; line-height: 1.7; }
    .blog-item .date { 
        font-size: 0.9rem; color: #e6b800; font-weight: bold; 
        display: block; margin-bottom: 12px;
    }

    footer { background: #222; color: #bbb; padding: 50px 20px; text-align: center; margin-top: 100px; font-size: 0.9rem; }

    /* 6. 모바일 대응 */
    @media (max-width: 768px) {
        header { flex-direction: column; height: auto; padding: 20px 10px; }
        .logo-img { height: 45px; }
        nav { margin-top: 15px; gap: 15px; }
        nav a { font-size: 0.9rem; }
        .page-header h2 { font-size: 2.2rem; }
    }
</style>
</head>
<body>

<header role="banner">
    <a href="index.html" class="logo-container">
        <img src="RaphaelsvgLogo.png" alt="라파엘코러스" class="logo-img">
    </a>
    <nav role="navigation">
        <a href="index.html">Raphael</a>
        <a href="about.html">About</a>
        <a href="story.html" aria-current="page">Story</a>
        <a href="support.html">Support</a>
    </nav>
</header>

<main class="container">
    <div class="page-header">
        <h2>Story</h2>
        <p>기적같은 순간을 살아내는 라파엘코러스의 이야기</p>
    </div>

    <div id="blog-list">
        <p style="text-align: center;">소식을 불러오는 중입니다...</p>
    </div>
</main>

<footer>
    <p>&copy; 2026 Raphael Chorus. All rights reserved.</p>
</footer>

<script>
    const NAVER_ID = 'raphaelchorus';
    const RSS_URL = `https://rss.blog.naver.com/${NAVER_ID}.xml`;

    async function fetchBlog() {
        const listContainer = document.getElementById('blog-list');
        try {
            // AllOrigins 서비스를 사용하여 네이버 RSS를 직접 긁어옵니다 (가장 안정적)
            const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(RSS_URL)}`);
            const data = await response.json();
            
            // XML 텍스트를 데이터화함
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(data.contents, "text/xml");
            const items = xmlDoc.querySelectorAll("item");

            if (items.length > 0) {
                let htmlContent = '';
                items.forEach(item => {
                    const title = item.querySelector("title").textContent;
                    const link = item.querySelector("link").textContent;
                    const pubDate = item.querySelector("pubDate").textContent;
                    const description = item.querySelector("description").textContent;
                    
                    // 날짜 포맷 깔끔하게 정리
                    const dateObj = new Date(pubDate);
                    const formattedDate = `${dateObj.getFullYear()}-${(dateObj.getMonth()+1).toString().padStart(2,'0')}-${dateObj.getDate().toString().padStart(2,'0')}`;

                    htmlContent += `
                        <article class="blog-item">
                            <a href="${link}" target="_blank">
                                <span class="date">${formattedDate}</span>
                                <h3>${title}</h3>
                                <p>${description.replace(/<[^>]*>?/gm, '').substring(0, 120)}...</p>
                            </a>
                        </article>
                    `;
                });
                listContainer.innerHTML = htmlContent;
            } else {
                throw new Error('데이터 없음');
            }
        } catch (error) {
            console.error('Error fetching blog:', error);
            // 블로그 연결 실패 시 보여줄 '안전 버튼' 디자인
            listContainer.innerHTML = `
                <div style="text-align:center; padding: 60px 30px; background:#fff; border-radius:25px; border:2px dashed #ffcc00; margin-top:20px;">
                    <h3 style="margin-bottom:20px; color:#333;">소식을 불러오는 중입니다.</h3>
                    <p style="color:#666; margin-bottom:30px;">잠시 후 다시 시도하거나, 아래 버튼을 통해 공식 블로그에서</p>
                    <a href="https://blog.naver.com/${NAVER_ID}" target="_blank" style="color:#ffcc00; font-weight:bold; text-decoration:none;">
                        라파엘코러스 공식 블로그 바로가기 →
                    </a>
                </div>`;
        }
    }

    window.onload = fetchBlog;
</script>
</body>
</html>
