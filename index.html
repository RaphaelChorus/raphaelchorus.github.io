    /* 4. 히어로 섹션 */
    .hero {

    }

    .news-card:hover {

        box-shadow: 0 15px 35px rgba(0,0,0,0.12);

    }

    .news-text { padding: 35px; }

    .news-card h4 { font-size: 1.5rem; margin: 15px 0 10px 0; color: #222; }
    .news-card p { color: #666; font-size: 1.05rem; line-height: 1.7; margin-bottom: 0; }
    
    /* 펼쳐지는 상세내용 박스 */
    .news-details {
        display: none;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px dashed #ddd;
        color: #444;
    }

    .click-info { font-size: 0.95rem; color: #e6b800; font-weight: bold; text-align: right; margin-top: 15px; }

    footer { background: #222; color: #bbb; padding: 50px 20px; text-align: center; font-size: 0.9rem; }

    /* 6. 모바일 반응형 */
    @media (max-width: 768px) {
        header { flex-direction: column; height: auto; padding: 20px 10px; }
        .logo-img { height: 45px; }
        nav { margin-top: 15px; gap: 15px; }
        nav a { font-size: 0.9rem; }
        .hero { height: 400px; }
        .hero-text { width: 90%; margin-left: 0; padding-right: 0; text-align: center; }

    <script>
        /**
         * 소식 업데이트 데이터
         * details 항목에 원하는 이미지와 긴 글을 넣으세요.
         */
        const newsData = [
        {
                tag: "Now, We sing of Dreams!",
                tagClass: "",
                title: "Now, We sing of Dreams!",
                desc: "2026의 기대",
                details: `
                    <p>2026년은 라파엘코러스의 놀라운 행보를 시작하게 됩니다.</p>
                    <p>8월25일에는 'Now, We sing of Dreams!'의 첫 시리즈인 Ep.1을 공개하며</p>
                    <p>12월 7일에는 이어지는 Ep.2를 공연합니다.</p>
                    <p>연세대학교 백주년기념 콘서트홀에서 열릴 8월의 공연에서는</p>
                    <p>순서 하나하나가 새로운 거기에 가슴에 요동치는 충격파를 남길</p>
                    <p>라파엘코러스의 놀라운 퍼포먼스의 장대함을 보여주는 다양한 공연이 될 것입니다.</p>
                    <p>세종문화회관 체임버홀에서의 12월 공연은</p>
                    <p>우리의 내면을 꺼내어 고백하고 공감 받으려하는 마음을 전달하고</p>
                    <p>결국에는 우리가 받게되는 호응으로 관객에 희망을 더해 줄 것입니다.</p>
                    <p>2026년의 라파엘의 행보에 기대해 주시고 응원을 보내 주시기 바랍니다.</p>
                `
            },
            {
                tag: "나들이",
                tagClass: "",
                title: "서울숲에 울려퍼진 웃음소리",
                desc: "라파엘 야유회",
                details: `
                    <p>2026년 5월 25일, 부처님오신날의 대체휴일 아침.</p>
                    <p>비밀작전처럼 완벽하게 임원들 중심으로 준비해온 야유회</p>
                    <p>그 수고로 모두가 즐거운 시간을 가졌습니다.</p>
                    <p>성대에서 맛본 맛집의 앙콜 등장, 그리고 기가막힌 햇살.</p>
                    <p>간식과 음료, 과일</p>
                    <p>그리고 세심한 선물까지</p>
                    <p>사랑 냄새가 나는 모든 것에 가슴이 훈훈해진,</p>
                    <p>콧구멍은 신선해진,</p>
                    <p>그리고 발걸음은 가벼워진 하루였습니다.</p>
                    <p>다시 한번 라파엘에 박수를 보냅니다.</p>
                `
            },
            {
                tag: "특별공연",
                tagClass: "support",
                title: "발레단과 함께하는 특별한 무대 (Carmina Burana)",
                desc: "5월 19일, 성균관대학교에서 세계 최초로 시도되는 발레와 시각장애인 합창단의 콜라보 무대가 열립니다.",
                details: `
                    <p>싱그러운 초록빛이 마음까지 물들이는 5월, 라파엘코러스의 특별한 공연 소식을 알려드립니다.</p>
                    <p>이번에는 성균관대학교 무용과 학생들의 발레 공연 중 마지막 순서를 라파엘코러스의 합창과 함께 무대에 올리게 되었습니다. 이는 <strong>세계 최초의 시도</strong>로 추정됩니다.</p>
                    <p>라파엘 단원들에게 움직임의 아름다움을 알게 해주고 싶어했던 마음이 이토록 귀한 열매를 맺었습니다.</p>
                    <div style="background-color: #fafafa; padding: 15px; border-radius: 10px; margin: 20px 0; border-left: 4px solid #ffcc00;">
                        <p style="margin: 5px 0;"><strong>일시:</strong> 5월 19일 (화) 오후 7시 30분</p>
                        <p style="margin: 5px 0;"><strong>장소:</strong> 성균관대학교 600주년 기념관 내 새천년홀</p>
                        <p style="margin: 5px 0;"><strong>공연 곡:</strong> Carmina Burana (카르미나 부라나) 하이라이트</p>
                    </div>
                    <p>발레단과 함께하는 특별한 무대를 통해 운명과 인간의 희노애락을 함께 경험하는 뜨겁고 감동적인 순간이 될 것입니다. 여러분의 많은 응원과 관람 부탁드립니다.</p>
                `
            },
                        {
                tag: "라파엘워십",
                tagClass: "",
                title: "라파엘코러스의 진정한 예배",
                desc: "이번 워십은... (클릭)",
                details: `
                    <img src="RaphaelWorship260308.png" style="width:100%; border-radius:15px; margin-bottom:15px;">
                    <p>라파엘코러스에서는 2026년 3월 8일 주일 오후5시에 금호중앙교회에서</p>
                    <p>심령을 울리는 뜨거운 영혼의 전도자이신 최주일 목사님과 함께</p>
                    <p>라파엘코러스 단원들을 위해 드리는 귀한 예배를 올리게 되었습니다.</p>
                    <p>최초로 드리는 이 '라파엘워십'에서는 하나님을 향해 올리는 진정한 예배를 드립니다.</p>
                    <p>이 귀한 워십을 라파엘코러스는 준비하고 연습하여 온마음과 정성을 다해 드립니다.</p>
                    <p>이 예배를 통하여 오직 하나님 홀로 영광 돌려 받으시고</p> 
                    <p>라파엘코러스 단원 여러분 모두 하나님께 귀한 예배를 통한 소통이 이루어지기 마음다해 소원합니다.</p>
                `
            },
            {
                tag: "지원선정",
                tagClass: "support",
                title: "2026년 사업 지원 선정",
                desc: "한국장애인문화예술원 지원사업 선정 관련 소식입니다.",
                details: `
                    <p>한국장애인문화예술원은 2026 지원사업에 라파엘코러스를 선정하였음을 공표하였습니다.</p>
                    <p>단원들의 열정이 빛을 발하는 순간이었습니다. 더 멋진 무대로 보답하겠습니다.</p>
                    <p><a href="https://www.kdac.or.kr/board/read?boardManagementNo=25&boardNo=4208&menuNo=46" target="_blank" style="color:#e6b800; font-weight:bold;">[원문 기사 확인하기]</a></p>
                `
            },
            {
                tag: "언론보도",
                tagClass: "",
                title: "[조선일보] \"어둠 속에 울려 퍼진 희망의 성가\"",
                desc: "라파엘코러스의 감동적인 무대 영상과 인터뷰를 만나보세요.",
                details: `
                    <p>2025년 크리스마스, 라파엘코러스의 인터뷰 내용이 조선일보에 보도되었습니다.</p>
                    <p>어둠 속에서도 굴하지 않고 화음을 맞추는 단원들의 삶의 이야기를 확인하실 수 있습니다.</p>
                    <p><a href="https://www.chosun.com/video_photo/2025/12/25/3ECK5GR63FHIVLIDLQ6CNZTTYQ/" target="_blank" style="color:#e6b800; font-weight:bold;">[조선일보 기사 전문 보기]</a></p>
                `
            }
        ];

        function renderNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = newsData.map((news, index) => `
                <article class="news-card" onclick="toggleDetails(${index})">
                    <div class="news-text">
                        <span class="news-tag ${news.tagClass}">${news.tag}</span>
                        <h4>${news.title}</h4>
                        <p>${news.desc}</p>
                        
                        <div id="details-${index}" class="news-details">
                            ${news.details}
                        </div>
                        
                        <div class="click-info" id="btn-${index}">상세 내용 보기 ↓</div>
                    </div>
                </article>
            `).join('');
        }

        function toggleDetails(index) {
            const detailBox = document.getElementById(`details-${index}`);
            const btnText = document.getElementById(`btn-${index}`);
            
            if (detailBox.style.display === "none" || detailBox.style.display === "") {
                detailBox.style.display = "block";
                btnText.innerText = "닫기 ↑";
            } else {
                detailBox.style.display = "none";
                btnText.innerText = "상세 내용 보기 ↓";
            }
        }

        window.onload = renderNews;
    </script>
</body>
