<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story - Raphael Chorus</title>
    <style>
    /* 1. 기본 설정 */
    body { 
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
        margin: 0; padding: 0; line-height: 1.8; 
        background-color: #fffbe6; color: #333; 
    }

    /* 2. [업데이트] 통합 헤더 디자인 - index, about과 100% 일치 */
    /* [심플 황금 로고 헤더] */
header {
    background-color: #121212; /* 고급스러운 블랙 배경 */
    color: #ffffff;
    padding: 0 5%;
    height: 90px; /* 로고 크기에 맞춰 살짝 여유 있는 높이 */
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo-container {
    display: flex;
    align-items: center;
    text-decoration: none;
}

.logo-img {
    height: 55px; /* 메뉴 폰트(약 18px)의 약 3배 크기로 설정하여 웅장함 부여 */
    width: auto;
    display: block;
    transition: transform 0.3s ease;
}

.logo-img:hover {
    transform: scale(1.05); /* 살짝 커지는 효과 */
}

nav {
    display: flex;
    gap: 30px;
}

nav a {
    color: #ffffff;
    text-decoration: none;
    font-size: 1.1rem; /* 메뉴 폰트 크기 */
    font-weight: 500;
    transition: color 0.3s;
}

nav a:hover, nav a[aria-current="page"] {
    color: #ffcc00; /* 황금빛 로고와 어울리는 강조색 */
}

/* [모바일 대응] 폰에서도 예술적인 비율 유지 */
@media (max-width: 768px) {
    header {
        height: auto;
        padding: 15px 20px;
        flex-direction: column; /* 세로 배열로 깔끔하게 */
        gap: 15px;
    }

    .logo-img {
        height: 45px; /* 모바일에서 살짝 조정 */
    }

    nav {
        gap: 15px;
    }

    nav a {
        font-size: 0.95rem;
    }
}

    /* 4. 컨테이너 및 페이지 헤더 (헤더 고정으로 인한 여백 추가) */
    .container { max-width: 850px; margin: 140px auto 60px; padding: 0 20px; }
    .page-header { text-align: center; margin-bottom: 60px; }
    .page-header h2 { font-size: 2.8rem; margin-bottom: 15px; color: #111; letter-spacing: -1px; }
    .page-header p { font-size: 1.2rem; color: #666; }

    /* 5. 블로그 리스트 스타일 */
    #blog-list { list-style: none; padding: 0; }
    .blog-item { 
        background: #fff; margin-bottom: 30px; border-radius: 20px; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden;
        border: 1px solid #eee;
        transition: all 0.4s ease;
    }
    .blog-item:hover { 
        transform: translateY(-8px); 
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        border-color: #ffcc00; 
    }
    .blog-item a { text-decoration: none; color: inherit; display: block; padding: 35px; }
    .blog-item h3 { margin: 0 0 12px 0; font-size: 1.5rem; color: #111; line-height: 1.4; }
    .blog-item p { margin: 0; color: #555; font-size: 1.05rem; line-height: 1.7; }
    .blog-item .date { 
        font-size: 0.9rem; color: #ffcc00; font-weight: bold; 
        display: block; margin-bottom: 12px; text-transform: uppercase;
    }

    footer { background: #1a1a1a; color: #888; padding: 50px; text-align: center; margin-top: 100px; }

    /* 6. [모바일 업데이트] 예술적 비율 대응 */
    @media (max-width: 768px) {
        header { 
            flex-direction: column; height: auto; padding: 15px 10px;
            background: rgba(18, 18, 18, 0.98);
        }
        .logo-img { height: 40px; }
        nav { margin-top: 15px; gap: 15px; width: 100%; justify-content: center; }
        nav a { font-size: 0.9rem; }
        
        .container { margin-top: 130px; }
        .page-header h2 { font-size: 2rem; }
        .blog-item a { padding: 25px; }
        .blog-item h3 { font-size: 1.3rem; }
    }
</style>
</head>
<body>

<header role="banner">
    <a href="index.html" class="logo-container">
        <img src="RaphaelsvgLogo.png" alt="라파엘코러스" class="logo-img">
    </a>
    <nav role="navigation">
        <a href="index.html">Raphael</a>
        <a href="about.html">About</a>
        <a href="story.html">Story</a>
        <a href="performance.html">Gallery</a>
        <a href="support.html">Support</a>
    </nav>
</header>

<main class="container">
    <div class="page-header">
        <h2>Story</h2>
        <p>단원들의 소중한 목소리를 담은 블로그 소식입니다.</p>
    </div>

    <div id="blog-list">
        <p style="text-align: center;">소식을 불러오는 중입니다...</p>
    </div>
</main>

<footer>
    <p>&copy; 2026 Raphael Chorus. All rights reserved.</p>
</footer>

<script>
    // 네이버 블로그 ID와 카테고리명을 입력하세요 (카테고리명은 정확해야 합니다)
    const NAVER_ID = 'raphaelchorus'; 
    const RSS_URL = `https://rss.blog.naver.com/${NAVER_ID}.xml`;

    // RSS 데이터를 가져와서 화면에 뿌려주는 함수 (간단한 버전)
    async function fetchBlog() {
        try {
            // 구글에서 제공하는 RSS to JSON 변환 API를 활용합니다
            const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`);
            const data = await response.json();
            const listContainer = document.getElementById('blog-list');

            if (data.status === 'ok') {
                listContainer.innerHTML = data.items.map(item => `
                    <article class="blog-item">
                        <a href="${item.link}" target="_blank">
                            <span class="date">${item.pubDate.split(' ')[0]}</span>
                            <h3>${item.title}</h3>
                            <p>${item.description.replace(/<[^>]*>?/gm, '').substring(0, 100)}...</p>
                        </a>
                    </article>
                `).join('');
            } else {
                listContainer.innerHTML = '<p style="text-align:center;">블로그 글을 불러올 수 없습니다. 링크를 직접 확인해주세요.</p>';
            }
        } catch (error) {
            console.error('Error fetching blog:', error);
        }
    }

    fetchBlog();
</script>
</body>
</html>
