<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Raphael Chorus</title>
    <style>
        /* 기본 베이스 */
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; background-color: #fffbe6; line-height: 1.8; }

        /* 헤더 (index와 동일) */
        header {
            background-color: #121212; padding: 0 5%; height: 100px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }
        .logo-img { height: 60px; width: auto; transition: 0.3s; }
        nav { display: flex; gap: 30px; }
        nav a { color: #fff; text-decoration: none; font-weight: 500; }
        nav a:hover, nav a[aria-current="page"] { color: #ffcc00; }

        /* 배너 섹션 */
        .banner {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('about_banner.jpg');
            background-size: cover; background-position: center;
            height: 350px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
        }
        .banner h1 { font-size: 3.5rem; margin: 0; font-family: 'Princess Sofia', cursive; color: #ffcc00; }

        /* 탭 버튼 스타일 */
        .tab-container { 
            display: flex; justify-content: center; gap: 0; 
            margin: -30px auto 50px; position: relative; z-index: 10;
        }
        .tab-btn {
            background: #fff; border: 2px solid #ffcc00; padding: 15px 50px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s;
            color: #121212;
        }
        .tab-btn.left { border-radius: 50px 0 0 50px; }
        .tab-btn.right { border-radius: 0 50px 50px 0; border-left: none; }
        .tab-btn.active { background: #ffcc00; color: #fff; }

        /* 조직도 컨텐츠 박스 */
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px 80px; }
        .content-section { display: none; animation: fadeIn 0.5s ease; }
        .content-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 멤버 카드 디자인 */
        .group-title { text-align: center; font-size: 2rem; margin: 40px 0; color: #121212; }
        .member-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 30px; }
        .member-card { background: #fff; border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .photo-circle { width: 130px; height: 130px; border-radius: 50%; margin: 0 auto 15px; overflow: hidden; border: 3px solid #ffcc00; }
        .photo-circle img { width: 100%; height: 100%; object-fit: cover; }

        /* 리더(서포터즈) 카드 디자인 */
        .leader-card { 
            display: flex; background: #fff; border-radius: 20px; padding: 35px; 
            margin-bottom: 30px; align-items: center; gap: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .leader-photo { width: 180px; height: 180px; border-radius: 15px; overflow: hidden; flex-shrink: 0; }
        .leader-photo img { width: 100%; height: 100%; object-fit: cover; }
        .leader-info h4 { font-size: 1.6rem; margin: 0; }
        .role-tag { color: #e6b800; font-weight: bold; font-size: 1rem; }
        .bio-text { color: #666; font-size: 1rem; margin-top: 10px; }

        footer { background: #121212; color: #888; padding: 40px; text-align: center; }

        @media (max-width: 768px) {
            .leader-card { flex-direction: column; text-align: center; }
            .tab-btn { padding: 12px 30px; font-size: 1rem; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html"><img src="RaphaelsvgLogo.png" class="logo-img" alt="로고"></a>
    <nav>
        <a href="index.html">Raphael</a>
        <a href="about.html" aria-current="page">About</a>
        <a href="story.html">Story</a>
        <a href="performance.html">Gallery</a>
        <a href="support.html">Support</a>
    </nav>
</header>

<section class="banner">
    <h1>Glorious Records</h1>
    <p>우리의 목소리가 기록이 되는 순간</p>
</section>

<div class="tab-container">
    <button class="tab-btn left active" onclick="openTab('singers')">Singers</button>
    <button class="tab-btn right" onclick="openTab('supporters')">Supporters</button>
</div>

<main class="container">
    <section id="singers" class="content-section active">
        <h3 class="group-title">Advisors</h3>
        <div class="member-grid" id="advisor-list"></div>

        <h3 class="group-title">Chorus Members</h3>
        <div class="member-grid" id="member-list"></div>
    </section>

    <section id="supporters" class="content-section">
        <h3 class="group-title">Our Leadership</h3>
        <div id="leader-list"></div>

        <h3 class="group-title">Artistic Staff</h3>
        <div class="member-grid" id="staff-list"></div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Raphael Chorus. All rights reserved.</p>
</footer>

<script>
    const orgData = {
        advisors: [
            { name: "고문 1", photo: "adv1.jpg" },
            { name: "고문 2", photo: "adv2.jpg" }
        ],
        members: [
            { name: "단원 1", photo: "m1.jpg", part: "Soprano" },
            { name: "단원 2", photo: "m2.jpg", part: "Alto" },
            { name: "단원 3", photo: "m3.jpg", part: "Tenor" },
            { name: "단원 4", photo: "m4.jpg", part: "Bass" }
        ],
        leaders: [
            { name: "예술감독 성함", role: "Artistic Director", photo: "dir.jpg", bio: "경력사항을 입력하세요.<br>여러 줄 입력이 가능합니다." },
            { name: "단장 성함", role: "President", photo: "pres.jpg", bio: "단장님의 인사말이나 약력을 입력하세요." }
        ],
        staff: [
            { name: "트레이너 성함", role: "Vocal Trainer", photo: "train.jpg" },
            { name: "반주자 성함", role: "Accompanist", photo: "piano.jpg" }
        ]
    };

    function renderAll() {
        // 고문 렌더링
        document.getElementById('advisor-list').innerHTML = orgData.advisors.map(a => `
            <div class="member-card">
                <div class="photo-circle"><img src="${a.photo}"></div>
                <div style="font-weight:bold;">${a.name}</div>
                <div style="color:#e6b800; font-size:0.9rem;">고문</div>
            </div>
        `).join('');

        // 단원 렌더링
        document.getElementById('member-list').innerHTML = orgData.members.map(m => `
            <div class="member-card">
                <div class="photo-circle"><img src="${m.photo}"></div>
                <div style="font-weight:bold;">${m.name}</div>
                <div style="color:#999; font-size:0.85rem;">${m.part}</div>
            </div>
        `).join('');

        // 리더(감독/단장) 렌더링
        document.getElementById('leader-list').innerHTML = orgData.leaders.map(l => `
            <div class="leader-card">
                <div class="leader-photo"><img src="${l.photo}"></div>
                <div class="leader-info">
                    <span class="role-tag">${l.role}</span>
                    <h4>${l.name}</h4>
                    <p class="bio-text">${l.bio}</p>
                </div>
            </div>
        `).join('');

        // 스태프(트레이너/반주) 렌더링
        document.getElementById('staff-list').innerHTML = orgData.staff.map(s => `
            <div class="member-card">
                <div class="photo-circle"><img src="${s.photo}"></div>
                <div style="font-weight:bold;">${s.name}</div>
                <div style="color:#e6b800; font-size:0.9rem;">${s.role}</div>
            </div>
        `).join('');
    }

    function openTab(tabId) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    window.onload = renderAll;
</script>

</body>
</html>
