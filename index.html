<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>라파엘코러스 - 희망을 노래하다</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="라파엘코러스 - 시각장애인으로 구성된 천상의 화음, 희망을 노래하는 합창단입니다.">
    <meta name="keywords" content="라파엘코러스, 라파엘, 장애인, 장애인합창단, 시각장애인 합창단, 합창단, Raphael Chorus, Raphael, Disabled, Choir for the Disabled, Blind Choir, Choir, Performance">
    <meta name="author" content="라파엘코러스">

    <meta property="og:type" content="website">
    <meta property="og:title" content="라파엘코러스 - 천사의 합창">
    <meta property="og:description" content="시각장애를 넘어 노래로 얻은 빛으로 세상을 밝히는 합창단">
    <meta property="og:image" content="https://raphaelchorus.github.io/H2_00635.jpg"> 
    <meta property="og:url" content="https://raphaelchorus.github.io">

    <link href="https://fonts.googleapis.com/css2?family=Princess+Sofia&display=swap" rel="stylesheet">

    <style>
    /* 1. 헤더 스타일 - 블랙 배경 고정 */
    header {
        background-color: #121212 !important; 
        padding: 0 5%;
        height: 110px; /* 로고를 위해 높이를 조금 더 확보 */
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 2px 15px rgba(0,0,0,0.5);
    }

    /* 2. 클래스명을 바꿔서 캐시 충돌 방지 및 배경 완전 제거 */
    .main-logo-box {
        display: flex;
        align-items: center;
        text-decoration: none;
        background: transparent !important; /* 투명 배경 */
        border: none !important;           /* 테두리 제거 */
        padding: 0 !important;
        margin: 0 !important;
    }

    /* 3. 이미지 크기 강제 확대 */
    .main-logo-box img {
        height: 80px; /* 로고 높이를 대폭 키움 */
        width: auto;
        display: block;
        /* 만약 이미지 파일 자체에 흰색/회색 여백이 포함되어 있다면 아래 scale로 키웁니다 */
        transform: scale(1.2); 
        transform-origin: left center;
        transition: transform 0.3s ease;
    }

    .main-logo-box img:hover {
        transform: scale(1.3);
    }

    /* 4. 네비게이션 (기존 유지) */
    nav { display: flex; gap: 30px; }
    nav a {
        color: #ffffff;
        text-decoration: none;
        font-size: 1.15rem;
        font-weight: bold;
    }
    nav a:hover, nav a[aria-current="page"] {
        color: #ffcc00;
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {
        header { height: auto; padding: 20px 10px; flex-direction: column; }
        .main-logo-box img { 
            height: 55px; 
            transform: scale(1.1); /* 모바일에서도 작지 않게 */
            margin-bottom: 10px;
        }
        nav { gap: 15px; }
    }
</style>
</head>
<body>
    <header role="banner">
    <a href="index.html" class="main-logo-box">
        <img src="RaphaelsvgLogo.png" alt="라파엘코러스">
    </a>
    <nav role="navigation">
        <a href="index.html">Raphael</a>
        <a href="about.html">About</a>
        <a href="story.html">Story</a>
        <a href="performance.html">Gallery</a>
        <a href="support.html">Support</a>
    </nav>
</header>

    <main id="main-content">
        <section class="hero">
            <div class="hero-text"> 
                <h2>노래로 품은 빛</h2>
                <p>세상을 환히 밝힌다.</p>
            </div>
        </section>

        <section class="content">
            <h3 style="font-size: 2.2rem; margin-bottom: 50px; color: #333;">최신 소식</h3>
            
            <div id="news-container"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 라파엘코러스. All rights reserved.</p>
        <p>이메일: raphaelchorus@naver.com | 전화: 010-8020-4413</p>
    </footer>

    <script>
        /**
         * 소식 업데이트 데이터
         * 새로운 소식을 가장 위에 추가하세요. (최대 5개 노출)
         */
        const newsData = [
            {
                tag: "지원선정",
                tagClass: "support",
                title: "2026년 사업 지원 선정",
                desc: "한국장애인문화예술원은 2026 지원사업에 라파엘코러스를 선정하였음을 공표하였습니다.",
                link: "https://www.kdac.or.kr/board/read?boardManagementNo=25&boardNo=4208&searchCategory=&page=1&searchType=&searchWord=&level=2&menuNo=46", // 링크가 없을 경우 # 유지 link: "#"
                linkText: "자세히 보기 →"
            },
            {
                tag: "언론보도",
                tagClass: "",
                title: "[조선일보] \"어둠 속에 울려 퍼진 희망의 성가\"",
                desc: "2025년 크리스마스, 라파엘코러스의 감동적인 무대 영상과 인터뷰 내용을 확인해 보세요.",
                link: "https://www.chosun.com/video_photo/2025/12/25/3ECK5GR63FHIVLIDLQ6CNZTTYQ/",
                linkText: "기사 전문 보기 →"
            }
        ];

        function renderNews() {
            const container = document.getElementById('news-container');
            // 최신순으로 최대 5개만 가져옴
            const displayNews = newsData.slice(0, 5);

            container.innerHTML = displayNews.map(news => `
                <a href="${news.link}" ${news.link !== '#' ? 'target="_blank"' : ''} class="news-link-wrapper">
                    <article class="news-card">
                        <div class="news-text">
                            <span class="news-tag ${news.tagClass}">${news.tag}</span>
                            <h4>${news.title}</h4>
                            <p>${news.desc}</p>
                            <div class="click-info">${news.linkText}</div>
                        </div>
                    </article>
                </a>
            `).join('');
        }

        window.onload = renderNews;
    </script>
</body>
</html>
