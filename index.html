<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>라파엘코러스 - 노래로 찾은 희망을 외친다</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="라파엘코러스 - 시각장애인으로 구성된 천상의 화음, 희망을 노래하는 합창단입니다.">
    <meta name="keywords" content="라파엘코러스, 라파엘, 장애인, 장애인합창단, 시각장애인 합창단, 합창단, Raphael Chorus, Raphael, Disabled, Choir for the Disabled, Blind Choir, Choir, Performance">
    <meta name="author" content="라파엘코러스">

    <meta property="og:type" content="website">
    <meta property="og:title" content="라파엘코러스 - 희망의 화음">
    <meta property="og:description" content="시각장애를 넘어 아름다운 노래를 선사하는 라파엘코러스입니다.">
    <meta property="og:image" content="https://raphaelchorus.github.io/H2_00635.jpg"> 
    <meta property="og:url" content="https://raphaelchorus.github.io">

    <link href="https://fonts.googleapis.com/css2?family=Princess+Sofia&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Malgun Gothic', 'Arial', sans-serif; margin: 0; padding: 0; line-height: 1.6; background-color: #fffbe6; }
        
        /* 헤더: 검은 배경을 없애고 Hero 섹션 위로 겹치게 설정 */
        header { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 5%; 
            z-index: 100;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent); /* 상단 글자 가독성 보호 */
        }

        /* SVG 로고 크기 조절 */
        .logo-svg { width: 280px; height: auto; }

        nav a { 
            color: #fff; 
            text-decoration: none; 
            margin-left: 25px; 
            font-weight: bold; 
            font-size: 1.1rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5); /* 사진 위 가독성 */
            transition: color 0.3s ease;
        }
        nav a:hover { color: #ffcc00; }

        /* 메인 배너 영역 */
        .hero { 
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('main.jpg');
            background-size: cover; 
            background-position: center;
            color: white;
            height: 650px; /* 헤더가 겹치므로 높이를 조금 더 키웠습니다 */
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .hero-text { 
            width: 50%; 
            margin-left: 45%; 
            text-align: right; 
            padding-right: 5%;
        }

        .hero h2 { font-size: 3rem; font-weight: bold; margin: 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .hero p { font-size: 1.6rem; margin: 15px 0; text-shadow: 1px 1px 5px rgba(0,0,0,0.5); }

        /* 최신 소식 섹션 */
        .content { padding: 80px 5%; text-align: center; }
        .news-link-wrapper {
            text-decoration: none;
            color: inherit;
            display: block;
            max-width: 700px;
            margin: 0 auto;
        }

        .news-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: left;
            transition: all 0.4s ease;
        }

        .news-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border-color: #ffcc00;
        }

        .news-text { padding: 40px; }
        .news-tag { background: #ffcc00; color: #000; padding: 6px 15px; font-size: 0.85rem; font-weight: bold; border-radius: 50px; }
        .news-card h4 { font-size: 1.5rem; margin: 20px 0 10px 0; color: #222; }
        .news-card p { color: #666; font-size: 1.1rem; line-height: 1.7; }
        .click-info { font-size: 1rem; color: #e6b800; font-weight: bold; text-align: right; margin-top: 15px; }

        footer { background: #222; color: #bbb; padding: 50px 20px; text-align: center; font-size: 0.9rem; }
        footer p { margin: 5px 0; }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            header { flex-direction: column; background: rgba(0,0,0,0.7); position: relative; padding: 20px 10px; } 
            .logo-svg { width: 200px; }
            nav { margin-top: 15px; }
            nav a { margin: 0 10px; font-size: 0.95rem; }

            .hero { height: 450px; }
            .hero-text { width: 90%; margin-left: 0; padding-right: 0; text-align: center; }
            .hero h2 { font-size: 2rem; }
            .hero p { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <a href="#main-content" style="position:absolute; top:-100px; left:0; background:#ffcc00; color:#000; padding:10px; z-index:1001;" onfocus="this.style.top='0';" onblur="this.style.top='-100px';">본문 바로가기</a>

    <header role="banner">
        <div class="logo-area">
            <svg class="logo-svg" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" 
                      font-family="'Princess Sofia', cursive" 
                      font-size="55" 
                      fill="#ffcc00">
                  Raphael Chorus
                </text>
            </svg>
        </div>

        <nav role="navigation" aria-label="메인 메뉴">
            <a href="index.html" aria-current="page">홈</a>
            <a href="about.html">라파엘 소개</a>
            <a href="performance.html">갤러리</a>
            <a href="support.html">후원</a>
        </nav>
    </header>

    <main id="main-content" role="main">
        <section class="hero">
            <div class="hero-text"> 
                <h2>노래로 품은 빛</h2>
                <p>세상을 환히 밝힌다.</p>
            </div>
        </section>

        <section class="content" aria-labelledby="news-title">
            <h3 id="news-title" style="font-size: 2.2rem; margin-bottom: 40px; color: #333;">최신 소식</h3>
            
            <a href="https://www.chosun.com/video_photo/2025/12/25/3ECK5GR63FHIVLIDLQ6CNZTTYQ/" target="_blank" class="news-link-wrapper">
                <article class="news-card">
                    <div class="news-text">
                        <span class="news-tag">언론보도</span>
                        <h4>[조선일보] "어둠 속에 울려 퍼진 희망의 성가"</h4>
                        <p>2025년 크리스마스, 라파엘코러스의 감동적인 무대 영상과 인터뷰 내용을 확인해 보세요.</p>
                        <div class="click-info">기사 전문 보기 →</div>
                    </div>
                </article>
            </a>
        </section>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 라파엘코러스. All rights reserved.</p>
        <p>이메일: raphaelchorus@naver.com | 전화: 010-8020-4413</p>
    </footer>
</body>
</html>
